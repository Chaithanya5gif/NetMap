<!DOCTYPE html>
<html>
<head>
    <title>NetMap - Mumbai Network Quality</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #map { height: 100vh; width: 100%; }
        .header {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .header h1 { margin: 0; font-size: 18px; color: #1a1a1a; }
        .header p { margin: 4px 0 0; font-size: 12px; color: #666; }
        .legend {
            position: absolute;
            bottom: 30px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            font-size: 12px;
        }
        .legend-item { display: flex; align-items: center; margin: 4px 0; }
        .legend-color { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>NetMap Mumbai</h1>
        <p>Network quality by operator • Live data</p>
    </div>
    <div class="legend">
        <div class="legend-item"><div class="legend-color" style="background:#1A936F"></div>Jio</div>
        <div class="legend-item"><div class="legend-color" style="background:#004E89"></div>Airtel</div>
        <div class="legend-item"><div class="legend-color" style="background:#FF6B35"></div>Vi</div>
    </div>
    <div id="map"></div>

    <script>
        // Initialize map centered on Mumbai
        const map = L.map('map').setView([19.0760, 72.8777], 12);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Operator colors
        const colors = {
            'jio': '#1A936F',
            'airtel': '#004E89',
            'vi': '#FF6B35'
        };

        // Load GeoJSON
        fetch('mumbai_points.geojson')
            .then(response => response.json())
            .then(data => {
                // Sample 200 points per operator for performance
                const byOperator = {};
                data.features.forEach(f => {
                    const op = f.properties.operator;
                    if (!byOperator[op]) byOperator[op] = [];
                    byOperator[op].push(f);
                });

                const sampled = [];
                Object.keys(byOperator).forEach(op => {
                    const points = byOperator[op];
                    const shuffled = points.sort(() => 0.5 - Math.random());
                    sampled.push(...shuffled.slice(0, 200));
                });

                L.geoJSON(sampled, {
                    pointToLayer: function(feature, latlng) {
                        const quality = feature.properties.avg_quality;
                        const radius = 4 + (quality / 100) * 8; // 4-12px based on quality
                        
                        return L.circleMarker(latlng, {
                            radius: radius,
                            fillColor: colors[feature.properties.operator] || '#999',
                            color: '#000',
                            weight: 0.5,
                            opacity: 0.5,
                            fillOpacity: 0.7
                        });
                    },
                    onEachFeature: function(feature, layer) {
                        const p = feature.properties;
                        layer.bindPopup(`
                            <b>${p.operator.toUpperCase()}</b> ${p.technology}<br>
                            Quality: ${p.avg_quality}<br>
                            Download: ${p.avg_download} Mbps<br>
                            Tests: ${p.tests}
                        `);
                    }
                }).addTo(map);

                console.log(`Rendered ${sampled.length} points`);
            })
            .catch(err => console.error('Error loading GeoJSON:', err));
    </script>
</body>
</html>
