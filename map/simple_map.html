<!DOCTYPE html>
<html>
<head>
    <title>NetMap India - City Overview</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        #map { height: 100vh; width: 100%; }
        .header { position: absolute; top: 10px; left: 50px; z-index: 1000; background: white; padding: 12px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .header h1 { margin: 0; font-size: 18px; }
        .header p { margin: 4px 0 0; font-size: 12px; color: #666; }
        .legend { position: absolute; bottom: 30px; right: 10px; z-index: 1000; background: white; padding: 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); font-size: 12px; }
        .legend-item { display: flex; align-items: center; margin: 4px 0; }
        .legend-color { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>NetMap India</h1>
        <p>Network quality by city • Click for details</p>
    </div>
    <div class="legend">
        <div class="legend-item"><div class="legend-color" style="background:#1A936F"></div>Jio</div>
        <div class="legend-item"><div class="legend-color" style="background:#004E89"></div>Airtel</div>
        <div class="legend-item"><div class="legend-color" style="background:#FF6B35"></div>Vi</div>
    </div>
    <div id="map"></div>

    <script>
        const map = L.map('map').setView([22.5, 78.5], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const colors = {'jio': '#1A936F', 'airtel': '#004E89', 'vi': '#FF6B35'};
        
        // City coordinates and best operator data
        const cities = [
            {name: 'Mumbai', lat: 19.0760, lon: 72.8777, best: 'jio', quality: 71.94},
            {name: 'Delhi', lat: 28.7041, lon: 77.1025, best: 'jio', quality: 71.33},
            {name: 'Bangalore', lat: 12.9716, lon: 77.5946, best: 'jio', quality: 71.23},
            {name: 'Chennai', lat: 13.0827, lon: 80.2707, best: 'jio', quality: 72.22},
            {name: 'Kolkata', lat: 22.5726, lon: 88.3639, best: 'jio', quality: 72.03},
            {name: 'Hyderabad', lat: 17.3850, lon: 78.4867, best: 'jio', quality: 72.07},
            {name: 'Pune', lat: 18.5204, lon: 73.8567, best: 'jio', quality: 71.54},
            {name: 'Ahmedabad', lat: 23.0225, lon: 72.5714, best: 'jio', quality: 71.43},
            {name: 'Jaipur', lat: 26.9124, lon: 75.7873, best: 'jio', quality: 71.29},
            {name: 'Lucknow', lat: 26.8467, lon: 80.9462, best: 'jio', quality: 71.37}
        ];

        cities.forEach(city => {
            const radius = 8 + (city.quality - 65) * 2; // 8-22px based on quality
            L.circleMarker([city.lat, city.lon], {
                radius: radius,
                fillColor: colors[city.best],
                color: '#000',
                weight: 1,
                opacity: 0.8,
                fillOpacity: 0.7
            }).addTo(map).bindPopup(`
                <b>${city.name}</b><br>
                Best: ${city.best.toUpperCase()}<<br>
                Quality: ${city.quality}
            `);
        });
    </script>
</body>
</html>
